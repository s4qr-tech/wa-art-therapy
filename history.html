<script>
// ▼ 月ごとの活動。ここを書き換えると帯の中身が更新されます（どの時期に入るかは月から自動で決まります）
const MONTHS = [
  { m: 4,  title: '説明会',          tag: '新歓', text: '新メンバー向けの説明会。和紙ちぎりの体験コーナーも。' },
  { m: 5,  title: 'A施設訪問',       tag: '訪問', text: '今年度はじめての訪問。和紙で「こいのぼり」を貼りあわせました。' },
  { m: 6,  title: 'ロープレ・反省会', tag: '交流', text: '声かけのロールプレイと反省会。メンバー交流会もあわせて実施。' },
  { m: 7,  title: '七夕飾りづくり',   tag: '訪問', text: 'B施設で、ちぎった和紙の短冊と天の川をみんなで制作。' },
  { m: 8,  title: '夏合宿',          tag: '研究', text: '研究計画の見直しと、秋の題材の試作。' },
  { m: 9,  title: '敬老の日作品展',   tag: '展示', text: '施設のみなさんの作品を、施設のロビーで展示しました。' },
  { m: 10, title: '学園祭展示',       tag: '展示', text: '活動紹介パネルと、来場者向けのちぎり絵体験。' },
  { m: 11, title: '紅葉のちぎり絵',   tag: '訪問', text: 'C施設訪問。赤や黄の和紙を破いて紅葉の山をつくりました。' },
  { m: 12, title: '年末振り返り会',   tag: '交流', text: '1年の記録を見返し、みんなで次の年の目標を話し合いました。' },
  { m: 1,  title: 'お正月飾り',       tag: '訪問', text: '和紙を切り貼りして、干支と鏡もちの飾りを制作。' },
  { m: 2,  title: '研究まとめ',       tag: '研究', text: '活動記録とアンケートを分析し、報告書にまとめます。' },
  { m: 3,  title: '成果発表・追いコン', tag: '発表', text: '学内で成果を発表。卒業する先輩を送り出します。' },
];
// ▼ 5つの時期（四季＋長期休み）
const PERIODS = [
  { key: 'spring', ja: '春',     en: 'Spring',       range: 'Apr – Jun', jaRange: '4〜6月',  months: [4, 5, 6] },
  { key: 'summer', ja: '夏休み', en: 'Summer Break', range: 'Jul – Sep', jaRange: '7〜9月',  months: [7, 8, 9] },
  { key: 'autumn', ja: '秋',     en: 'Autumn',       range: 'Oct – Nov', jaRange: '10〜11月', months: [10, 11] },
  { key: 'winter', ja: '冬',     en: 'Winter',       range: 'Dec – Jan', jaRange: '12〜1月', months: [12, 1] },
  { key: 'plum',   ja: '春休み', en: 'Spring Break', range: 'Feb – Mar', jaRange: '2〜3月',  months: [2, 3] },
];

const strips = document.getElementById('strips');
strips.innerHTML = PERIODS.map(p => {
  // 新しい月が上に来るように並べる
  const acts = p.months.slice().reverse().flatMap(m => MONTHS.filter(d => d.m === m));
  return `
  <article class="strip ${p.key}" tabindex="0" aria-label="${p.ja}（${p.jaRange}）">
    <span class="tear t2"></span><span class="tear t1"></span><span class="dot"></span>
    <div class="ttl">${p.ja}</div>
    <div class="sub">${p.en} ／ ${p.range}</div>
    <div class="detail">
      <h3>${p.ja}<small>${p.jaRange}</small></h3>
      <ul class="acts">${acts.map(d => `
        <li><b>${d.m}月</b><div><span class="tag">${d.tag}</span><strong>${d.title}</strong><p>${d.text}</p></div></li>`).join('')}
      </ul>
    </div>
  </article>`;
}).join('');

const panel = document.getElementById('periodPanel');
const stripEls = [...strips.querySelectorAll('.strip')];
const isWide = () => matchMedia('(min-width: 861px)').matches;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

// PC：帯は動かさず、下のパネルの中身だけを切り替える
const select = i => {
  stripEls.forEach((x, j) => { x.classList.toggle('is-active', i === j); x.setAttribute('aria-pressed', i === j); });
  const render = () => {
    const src = stripEls[i].querySelector('.detail');
    panel.innerHTML = src.innerHTML;
    panel.className = 'period-panel ' + PERIODS[i].key;
  };
  if (calm || !panel.innerHTML) { render(); return; }
  panel.classList.add('fading');
  setTimeout(() => { render(); }, 180);
};

// スマホ：押すと開く（動きなし）
const toggle = s => {
  const open = !s.classList.contains('open');
  stripEls.forEach(x => x.classList.remove('open'));
  s.classList.toggle('open', open);
};

stripEls.forEach((s, i) => {
  const act = () => isWide() ? select(i) : toggle(s);
  s.addEventListener('click', act);
  s.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
});

// はじめは、いまの時期を表示
const nowMonth = new Date().getMonth() + 1;
select(Math.max(0, PERIODS.findIndex(p => p.months.includes(nowMonth))));
</script>
